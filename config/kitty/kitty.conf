# --- Aesthetics & Theme ---
include themes/catppuccin-macchiato.conf
background_opacity 0.95
# Disable blur on the X270; it's a GPU hog on older Intel chips
background_blur 0 

# --- Performance Tweaks ---
# Change this to 'wayland' if you are on GNOME Wayland (default for Fedora)
# It reduces input lag significantly compared to x11
linux_display_server wayland
update_check_interval 0
repaint_delay 10
input_delay 3
sync_to_monitor yes

# --- Font ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 17

# --- Cursor & Mouse ---
cursor_shape block
shell_integration enabled
# Keeps the cursor static (saves tiny bit of CPU/battery)
cursor_blink_interval 0
mouse_hide_wait 3.0

# --- Window Layout ---
remember_window_size  no
initial_window_width  1000
initial_window_height 650
window_padding_width 4
# Adding a little padding makes Neovim look much more professional
hide_window_decorations yes
# Removing decorations gives you more vertical space on that X270 screen

# --- Keybindings (Your existing ones are good, keep them) ---
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+enter new_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
